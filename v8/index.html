<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII-V8</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;color:#bbb}
  #app{position:relative;height:100%;width:min(100vw,62vh);margin:0 auto;display:flex;flex-direction:column;background:#000}
  #stage{position:relative;flex:0 0 61%;overflow:hidden;cursor:pointer;touch-action:manipulation}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:absolute;font-size:11px;line-height:1.55;color:#7d8590;pointer-events:none;white-space:pre}
  #hudL{left:6%;bottom:2.5%}
  #hudT{right:4%;top:11%;color:#ff5d6c}
  #hudT b{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff3b4f;margin-right:6px;vertical-align:1px}
  .btns{position:absolute;left:4%;top:3%;display:flex;gap:6px}
  .btns button{background:none;border:1px solid #2a2f36;color:#7d8590;font:inherit;font-size:11px;
    padding:3px 8px;border-radius:4px;cursor:pointer}
  .btns button:hover{color:#ddd;border-color:#4a525c}
  #hint{position:absolute;right:4%;top:3%;font-size:10px;color:#4a525c;pointer-events:none}
  #bar{display:flex;justify-content:space-between;font-size:12px;color:#ddd;padding:6px 3.5%;border-bottom:1px solid #16191d}
  #bar span:last-child{color:#888}
  #code{position:relative;flex:1;overflow:hidden;font-size:clamp(10px,3.3vw,15px);line-height:1.6;
    -webkit-mask-image:linear-gradient(#0000 0,#000 14%,#000 72%,#0000 100%);mask-image:linear-gradient(#0000 0,#000 14%,#000 72%,#0000 100%)}
  #pre{position:absolute;left:0;right:0;top:0;margin:0;will-change:transform}
  .ln{display:flex;white-space:pre;border-left:3px solid transparent}
  .ln i{font-style:normal;color:#33383e;width:3.2em;text-align:right;padding-right:1.4em;flex:none}
  .ln.cur{background:#160d10;border-left-color:#ff5d6c}
  .ln.cur i{color:#777}
  .k{color:#ff7a90}.f{color:#82aaff}.n{color:#f6c177}.s{color:#c3e88d}.c{color:#5a5f66}
  .cursor{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:#ff5d6c;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="btns"><button id="replay">↻ заново</button><button id="pause">⏸</button></div>
    <div id="hint">тап — перегазовка</div>
    <div class="hud" id="hudT"><b></b>t 0.00s</div>
    <div class="hud" id="hudL"></div>
  </div>
  <div id="bar"><span>$ node v8.js</span><span id="fps">running · 60 fps</span></div>
  <div id="code"><div id="pre"></div></div>
</div>

<script id="src">

// ── v8.js — V8 в разрезе: коленвал, шатуны, поршни и вспышки в цилиндрах ──

const TAU = Math.PI * 2;
const CRANK = 0, ROD = 1, PISTON = 2, WALL = 3, HEAD = 4, GAS = 5, PLUG = 6;

function rng(seed) {                          // детерминированный генератор
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = rng(8);

// ── размеры: ход 0.9, шатун 1.25, развал блока 90° ──

const R = 0.45, LROD = 1.25, BORE = 0.4, DECK = 2.2;
const THROWS = [0, 90, 270, 180].map(d => d * Math.PI / 180);   // крестовой коленвал
const THROW_Z = [1.5, 0.5, -0.5, -1.5];
const BANKS = [135, 45].map(d => d * Math.PI / 180);            // левый и правый ряд

// цилиндры: левый ряд 1-3-5-7, правый 2-4-6-8 (спереди назад)
const cyl = [];
for (let k = 0; k < 4; k++)
  for (let b = 0; b < 2; b++) {
    const ang = BANKS[b];
    cyl.push({ n: 2 * k + b + 1, k, b, ang, ax: [Math.cos(ang), Math.sin(ang)],
               z: THROW_Z[k] + (b ? -0.17 : 0.17), flash: 0 });
  }

// ВМТ каждого цилиндра и чередование тактов: 8 вспышек на 720° через каждые 90°
const groups = {};
for (const c of cyl) {
  let tdc = (c.ang - THROWS[c.k]) % TAU; if (tdc < 0) tdc += TAU;
  c.tdc = tdc;
  const key = Math.round(tdc * 100);
  c.parity = groups[key] ? 1 : 0; groups[key] = true;
}
const ORDER = [...cyl].sort((a, b) => (a.tdc + a.parity * TAU) - (b.tdc + b.parity * TAU)).map(c => c.n);

// ── точки деталей в их собственных координатах ──

const parts = { crank: [], piston: [], rod: [], wall: [], head: [], gas: [] };
function add(arr, x, y, z, nx, ny, nz, kind, extra) {
  const l = Math.hypot(nx, ny, nz) || 1;
  arr.push(Object.assign({ x, y, z, nx: nx / l, ny: ny / l, nz: nz / l, kind, h: rand() }, extra));
}

function crankshaft() {
  const C = parts.crank;
  for (let i = 0; i <= 240; i++) {            // коренные шейки по всей длине
    const z = -2.25 + i / 240 * 4.5;
    for (let j = 0; j < 16; j++) {
      const a = j / 16 * TAU;
      add(C, Math.cos(a) * 0.2, Math.sin(a) * 0.2, z, Math.cos(a), Math.sin(a), 0, CRANK);
    }
  }
  THROWS.forEach((ps, k) => {
    const px = Math.cos(ps) * R, py = Math.sin(ps) * R, z0 = THROW_Z[k];
    for (let i = 0; i <= 40; i++) {           // шатунная шейка
      const z = z0 - 0.34 + i / 40 * 0.68;
      for (let j = 0; j < 16; j++) {
        const a = j / 16 * TAU;
        add(C, px + Math.cos(a) * 0.15, py + Math.sin(a) * 0.15, z, Math.cos(a), Math.sin(a), 0, CRANK);
      }
    }
    for (const zw of [z0 - 0.4, z0 + 0.4]) {   // щёки с противовесом
      for (let i = 0; i < 900; i++) {
        const a = rand() * TAU, q = Math.sqrt(rand());
        let x, y;
        if (i % 2) { x = px + Math.cos(a) * 0.27 * q; y = py + Math.sin(a) * 0.27 * q; }  // вокруг шейки
        else {                                                                           // противовес
          const ca = ps + Math.PI + (a / TAU - 0.5) * 2.2;
          const rr = 0.15 + q * 0.5; x = Math.cos(ca) * rr; y = Math.sin(ca) * rr;
        }
        const side = rand() < 0.5 ? -1 : 1;
        add(C, x, y, zw + side * 0.05, 0, 0, side, CRANK);
      }
    }
  });
  for (let i = 0; i < 360; i++) {             // маховик сзади: венец с зубьями
    const a = i / 360 * TAU;
    for (let j = 0; j < 4; j++) {
      const q = 0.92 + j * 0.03 + (Math.sin(a * 60) > 0 ? 0.03 : 0);
      add(C, Math.cos(a) * q, Math.sin(a) * q, -2.4, Math.cos(a), Math.sin(a), 0.4, CRANK);
    }
  }
}

function piston() {                           // u — вдоль оси цилиндра, 0 = поршневой палец
  const P = parts.piston;
  for (let i = 0; i < 420; i++) {             // днище
    const a = rand() * TAU, q = Math.sqrt(rand()) * BORE * 0.98;
    add(P, 0.25, Math.cos(a) * q, Math.sin(a) * q, 1, 0, 0, PISTON);
  }
  for (let i = 0; i <= 22; i++) {             // юбка с канавками колец
    const u = -0.2 + i / 22 * 0.45;
    for (let j = 0; j < 40; j++) {
      const a = j / 40 * TAU;
      add(P, u, Math.cos(a) * BORE, Math.sin(a) * BORE, 0, Math.cos(a), Math.sin(a), PISTON,
          { ring: u > 0.12 && (i % 3 === 0) });
    }
  }
}

function rod() {                              // t: 0 — нижняя головка, 1 — верхняя
  for (let i = 0; i <= 60; i++) {
    const t = i / 60, w = 0.07 + 0.03 * Math.abs(t - 0.5);
    for (let j = 0; j < 10; j++) {
      const a = j / 10 * TAU;
      parts.rod.push({ t, a, w, kind: ROD, h: rand() });
    }
  }
  for (const [t, rr] of [[0, 0.2], [1, 0.12]])              // головки шатуна
    for (let j = 0; j < 70; j++) parts.rod.push({ t, a: j / 70 * TAU, w: rr, eye: true, kind: ROD, h: rand() });
}

function walls() {                            // гильза цилиндра и головка блока — полупрозрачные
  for (let i = 0; i <= 34; i++) {
    const u = 0.85 + i / 34 * (DECK - 0.85);
    for (let j = 0; j < 30; j++) {
      const a = j / 30 * TAU;
      parts.wall.push({ u, v: Math.cos(a) * (BORE + 0.03), w: Math.sin(a) * (BORE + 0.03),
                        nv: Math.cos(a), nw: Math.sin(a), kind: WALL, h: rand() });
    }
  }
  // головка блока: каркас бруска над рядом — только рёбра
  const U = [DECK, DECK + 0.38], V = [-0.58, 0.58], Z = [-2.05, 2.05];
  const edge = (a, b, n) => { for (let i = 0; i <= n; i++) { const t = i / n;
    parts.head.push({ u: a[0] + (b[0] - a[0]) * t, v: a[1] + (b[1] - a[1]) * t, z: a[2] + (b[2] - a[2]) * t,
                      nu: 1, nv: 0, nz: 0, kind: HEAD, h: rand() }); } };
  for (const u of U) for (const v of V) edge([u, v, Z[0]], [u, v, Z[1]], 160);
  for (const u of U) for (const z of Z) edge([u, V[0], z], [u, V[1], z], 30);
  for (const v of V) for (const z of Z) edge([U[0], v, z], [U[1], v, z], 14);
  for (let i = 0; i < 260; i++)               // объём камеры сгорания для газа
    parts.gas.push({ q: Math.sqrt(rand()) * BORE * 0.95, a: rand() * TAU, f: rand(), kind: GAS, h: rand() });
}

crankshaft(); piston(); rod(); walls();

// ── кинематика: кривошипно-шатунный механизм ──

function pistonPos(theta, c) {
  const phi = theta + THROWS[c.k] - c.ang;
  const d = R * Math.cos(phi) + Math.sqrt(LROD * LROD - R * R * Math.sin(phi) ** 2);
  const pin = [Math.cos(theta + THROWS[c.k]) * R, Math.sin(theta + THROWS[c.k]) * R];
  return { d, pin, top: [c.ax[0] * d, c.ax[1] * d] };
}
function stroke(theta, c) {                   // фаза 720°-цикла: 0 — вспышка в ВМТ
  let x = (theta - c.tdc - c.parity * TAU) % (2 * TAU); if (x < 0) x += 2 * TAU;
  return x;
}

// ── камера и сетка символов ──

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const glow1 = document.createElement('canvas'), glow2 = document.createElement('canvas');
let W, H, DPR, cw, chh, cols, rows, s, cx, cy, cam;
let zb, bb, cb, kb, gl;
const DIST = 11;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  glow1.width = cv.width >> 2; glow1.height = cv.height >> 2;
  glow2.width = cv.width >> 3; glow2.height = cv.height >> 3;
  cols = 88; cw = W / cols; chh = cw * 1.55; rows = Math.ceil(H / chh);
  s = Math.min(W * 0.2, H * 0.24); cx = W / 2; cy = H * 0.52 + 0.55 * s;
  const n = cols * rows;
  zb = new Float32Array(n); bb = new Float32Array(n); cb = new Array(n); kb = new Int8Array(n); gl = new Float32Array(n);
}

function setCamera(t) {
  const yaw = 0.28 * Math.sin(t * 0.13) + 0.1, tilt = 0.2 + 0.07 * Math.sin(t * 0.09);
  cam = { cy: Math.cos(yaw), sy: Math.sin(yaw), ct: Math.cos(tilt), st: Math.sin(tilt) };
}
function project(x, y, z) {
  const xr = x * cam.cy + z * cam.sy, zr = -x * cam.sy + z * cam.cy;
  const yr = y * cam.ct - zr * cam.st, zt = y * cam.st + zr * cam.ct;
  const f = DIST / (DIST - zt);
  return [cx + xr * s * f, cy - yr * s * f, zt];
}
function viewN(nx, ny, nz) {
  const xr = nx * cam.cy + nz * cam.sy, zr = -nx * cam.sy + nz * cam.cy;
  return [xr, ny * cam.ct - zr * cam.st, ny * cam.st + zr * cam.ct];
}

// ── буквы ──

const RAMP = [' ', '.', '.,:', ':;-', '-=~+', '+<>()=', 'tjf[]{}?', 'aeozsu?', '0O%&e', '@$#&', '@$#'];
const glyph = (b, h) => { const s = RAMP[Math.min(10, Math.floor(b * 9))]; return s[(h * s.length) | 0]; };
function edgeGlyph(nx, ny) {
  if (Math.abs(nx) > 2.2 * Math.abs(ny)) return '|';
  if (Math.abs(ny) > 2.2 * Math.abs(nx)) return ny < 0 ? '_' : '-';
  return nx * ny > 0 ? '\\' : '/';
}
function fireColor(h) {                       // белый → жёлтый → оранжевый → красный
  if (h > 0.75) return [255, 245, 210];
  if (h > 0.45) return [255, 190, 60];
  if (h > 0.2) return [255, 110, 20];
  return [200, 40, 10];
}

const KEY = (() => { const v = [0.35, 0.8, 0.5], l = Math.hypot(...v); return v.map(c => c / l); })();
const stats = { letters: 0, firing: 0 };
let head = 0;

function render(t, theta) {
  zb.fill(-1e9); kb.fill(-1); gl.fill(0);
  head = (t - 0.2) / 2.2;                     // детали появляются снизу вверх
  const ct = Math.cos(theta), st = Math.sin(theta);

  const plot = (x, y, z, nx, ny, nz, kind, h, order, extra) => {
    const k = Math.min(1, Math.max(0, (head - order) / 0.12)); if (k <= 0) return;
    const [sx, sy, zz] = project(x, y, z);
    const c = (sx / cw) | 0, r = (sy / chh) | 0;
    if (c < 0 || c >= cols || r < 0 || r >= rows) return;
    const idx = r * cols + c;
    const shell = kind === WALL || kind === HEAD;
    if (shell ? (kb[idx] >= 0 && kb[idx] !== WALL && kb[idx] !== HEAD) || zz <= zb[idx] : zz <= zb[idx] && !(kb[idx] === WALL || kb[idx] === HEAD)) return;
    zb[idx] = zz;
    const [vx, vy, vz] = viewN(nx, ny, nz);
    const diff = Math.max(0, nx * KEY[0] + ny * KEY[1] + nz * KEY[2]);
    const spec = Math.pow(Math.max(0, vy * 0.45 + vz * 0.9), 16);
    const rim = Math.pow(1 - Math.abs(vz), 3);
    let b;
    if (kind === WALL) b = 0.1 + 0.15 * diff + 0.3 * rim;
    else if (kind === HEAD) b = 0.08 + 0.2 * diff;
    else b = (0.38 + 0.5 * diff + 0.9 * spec + 0.3 * rim) * (0.85 + 0.25 * h);
    if (extra === 'mark') b = 1.2;
    b *= k; bb[idx] = b; kb[idx] = kind;
    cb[idx] = (kind === WALL || kind === HEAD) ? (kind === HEAD || Math.abs(vz) < 0.3 ? edgeGlyph(vx, vy) : ' ')
            : extra === 'ring' ? '=' : (Math.abs(vz) < 0.22 && k >= 1) ? edgeGlyph(vx, vy) : glyph(Math.min(1.1, b), h);
  };

  // коленвал
  for (const p of parts.crank) {
    const x = p.x * ct - p.y * st, y = p.x * st + p.y * ct;
    const nx = p.nx * ct - p.ny * st, ny = p.nx * st + p.ny * ct;
    plot(x, y, p.z, nx, ny, p.nz, CRANK, p.h, 0, p.mark ? 'mark' : null);
  }

  let firing = 0;
  for (const c of cyl) {
    const { d, pin, top } = pistonPos(theta, c);
    const ax = c.ax, pv = [-ax[1], ax[0]];    // ось цилиндра и поперечное направление
    // поршень
    for (const p of parts.piston) {
      const u = d + p.x;
      plot(ax[0] * u + pv[0] * p.y, ax[1] * u + pv[1] * p.y, c.z + p.z,
           ax[0] * p.nx + pv[0] * p.ny, ax[1] * p.nx + pv[1] * p.ny, p.nz, PISTON, p.h, 0.45, p.ring ? 'ring' : null);
    }
    // шатун: от шатунной шейки к пальцу
    const rx = top[0] - pin[0], ry = top[1] - pin[1], rl = Math.hypot(rx, ry), ux = rx / rl, uy = ry / rl;
    for (const p of parts.rod) {
      const bx = pin[0] + rx * p.t, by = pin[1] + ry * p.t;
      const ca = Math.cos(p.a), sa = Math.sin(p.a);
      const ox = p.eye ? ca : -uy * ca, oy = p.eye ? sa : ux * ca, oz = p.eye ? 0 : sa;
      plot(bx + ox * p.w, by + oy * p.w, c.z + oz * p.w * (p.eye ? 0 : 1.4), ox, oy, oz + (p.eye ? (c.b ? -1 : 1) : 0), ROD, p.h, 0.3);
    }

    // такт: вспышка → выпуск → впуск → сжатие
    const x = stroke(theta, c);
    c.flash = x < 1.6 ? Math.exp(-x / 0.45) : 0;
    if (c.flash > 0.3) firing = c.n;
    c.phase = x < Math.PI ? 'power' : x < TAU ? 'exhaust' : x < 3 * Math.PI ? 'intake' : 'compress';
    const crown = d + 0.25, room = DECK - crown;
    if (head < 1) continue;
    for (const g of parts.gas) {
      const u = crown + 0.03 + g.f * (room - 0.05);
      const gx = ax[0] * u + pv[0] * Math.cos(g.a) * g.q, gy = ax[1] * u + pv[1] * Math.cos(g.a) * g.q, gz = c.z + Math.sin(g.a) * g.q;
      const [sx, sy, zz] = project(gx, gy, gz);
      const cc = (sx / cw) | 0, rr = (sy / chh) | 0;
      if (cc < 0 || cc >= cols || rr < 0 || rr >= rows) continue;
      const idx = rr * cols + cc;
      let v = 0, kind = 0;
      if (c.flash > 0.02) { v = c.flash * (0.6 + 0.6 * g.h) * (1.1 - g.f * 0.4); kind = 1; }
      else if (c.phase === 'intake') { v = 0.18 * (g.h > 0.6 ? 1 : 0); kind = 2; }
      else if (c.phase === 'compress') { v = 0.1 + 0.25 * ((x - 3 * Math.PI) / Math.PI) * (g.h > 0.4 ? 1 : 0); kind = 2; }
      else if (c.phase === 'exhaust') { v = 0.12 * (g.h > 0.7 ? 1 : 0); kind = 3; }
      if (v <= 0 || zz < zb[idx] - 0.6) continue;
      if (v > gl[idx]) { gl[idx] = v; kb[idx] = 10 + kind; zb[idx] = Math.max(zb[idx], zz); }
    }
  }
  stats.firing = firing;

  // гильзы — полупрозрачные, рисуются только в пустых клетках
  for (const c of cyl) {
    const ax = c.ax, pv = [-ax[1], ax[0]];
    for (const p of parts.wall)
      plot(ax[0] * p.u + pv[0] * p.v, ax[1] * p.u + pv[1] * p.v, c.z + p.w, pv[0] * p.nv, pv[1] * p.nv, p.nw, WALL, p.h, 0.6);
  }

  // головки блока
  for (const b of [0, 1]) {
    const ax = [Math.cos(BANKS[b]), Math.sin(BANKS[b])], pv = [-ax[1], ax[0]];
    for (const p of parts.head)
      plot(ax[0] * p.u + pv[0] * p.v, ax[1] * p.u + pv[1] * p.v, p.z,
           ax[0] * p.nu + pv[0] * p.nv, ax[1] * p.nu + pv[1] * p.nv, p.nz, HEAD, p.h, 0.75);
  }
  draw(t);
}

function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.font = `${Math.min(chh * 0.95, cw / 0.6).toFixed(2)}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  const put = (c, r, ch, rgb, al) => {
    if (al < 0.01 || c < 0 || c >= cols || r < 0 || r >= rows) return;
    ctx.fillStyle = `rgba(${rgb[0] | 0},${rgb[1] | 0},${rgb[2] | 0},${Math.min(1, al).toFixed(3)})`;
    ctx.fillText(ch, c * cw + cw / 2, r * chh);
  };
  const col = { 0: [240, 205, 140], 1: [120, 170, 240], 2: [245, 245, 250], 3: [110, 130, 160], 4: [110, 125, 150] };
  let letters = 0;
  const FIREG = '.:+*o%#@', GASG = '.,:;';
  for (let i = 0; i < cols * rows; i++) {
    if (zb[i] < -1e8) continue;
    const k = kb[i], c = i % cols, r = (i / cols) | 0;
    if (k >= 10) {                             // газы в камере
      const v = gl[i];
      if (k === 11) put(c, r, FIREG[Math.min(7, (v * 7) | 0)], fireColor(v), Math.min(1, v * 1.2));
      else if (k === 12) put(c, r, GASG[(c * 7 + r) % 4], [110, 170, 255], v * 2);
      else put(c, r, GASG[(c * 3 + r) % 4], [150, 150, 150], v * 2);
      letters++; continue;
    }
    const ch = cb[i]; if (ch === ' ') continue;
    const b = bb[i];
    put(c, r, ch, col[k], Math.min(1, 0.1 + b * 0.9));
    letters++;
  }
  // искра свечи и вспышка-звезда
  for (const cy0 of cyl) {
    if (cy0.flash < 0.55) continue;
    const u = DECK + 0.12, [sx, sy] = project(cy0.ax[0] * u, cy0.ax[1] * u, cy0.z);
    const c = Math.round(sx / cw), r = Math.round(sy / chh), L = 1 + Math.round(cy0.flash * 4);
    put(c, r, '*', [255, 255, 255], 1);
    for (let q = 1; q <= L; q++) {
      const a = (1 - q / (L + 1)) * cy0.flash;
      put(c - q * 2, r, '-', [255, 220, 150], a); put(c + q * 2, r, '-', [255, 220, 150], a);
      put(c, r - q, '|', [255, 220, 150], a); put(c, r + q, '|', [255, 220, 150], a);
    }
  }
  stats.letters = letters;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g1 = glow1.getContext('2d'), g2 = glow2.getContext('2d');
  g1.clearRect(0, 0, glow1.width, glow1.height); g1.drawImage(cv, 0, 0, glow1.width, glow1.height);
  g2.clearRect(0, 0, glow2.width, glow2.height); g2.drawImage(glow1, 0, 0, glow2.width, glow2.height);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.5; ctx.drawImage(glow1, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 0.5; ctx.drawImage(glow2, 0, 0, cv.width, cv.height);
}

// ── панель кода: показывает этот самый файл и «печатает» текущую строку ──

const SRC = document.getElementById('src').textContent.replace(/^\n+|\s+$/g, '').split('\n');
const KW = /^(const|let|var|function|return|for|if|else|of|new|while|continue|break|true|false|null)$/;
function hl(line) {
  const esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const re = /(\/\/.*$)|('(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    const tok = esc(m[0]);
    if (m[1]) out += `<span class="c">${tok}</span>`;
    else if (m[2]) out += `<span class="s">${tok}</span>`;
    else if (m[3]) out += `<span class="n">${tok}</span>`;
    else if (KW.test(m[4])) out += `<span class="k">${tok}</span>`;
    else if (line[re.lastIndex] === '(') out += `<span class="f">${tok}</span>`;
    else out += tok;
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}
const pre = document.getElementById('pre'), codeBox = document.getElementById('code');
const rowsEl = SRC.map((l, i) => {
  const d = document.createElement('div'); d.className = 'ln';
  d.innerHTML = `<i>${i + 1}</i><span>${hl(l) || ' '}</span>`;
  pre.appendChild(d); return d;
});
const LINES_PER_S = 7, CODE_LOOP = SRC.length / LINES_PER_S + 6;
let curLine = -1, curChars = -1, scrollY = 0;

function code(t) {
  const pos = Math.min(SRC.length - 1e-3, t * LINES_PER_S);
  const li = Math.floor(pos), text = SRC[li];
  const nch = Math.floor((pos - li) * 1.4 * text.length);
  if (li !== curLine) {
    if (curLine >= 0 && rowsEl[curLine]) {
      rowsEl[curLine].classList.remove('cur');
      rowsEl[curLine].lastChild.innerHTML = hl(SRC[curLine]) || ' ';
    }
    curLine = li; curChars = -1; rowsEl[li].classList.add('cur');
  }
  if (nch !== curChars) {
    curChars = nch;
    rowsEl[li].lastChild.innerHTML = hl(text.slice(0, nch)) + '<span class="cursor"></span>';
  }
  const target = rowsEl[li].offsetTop - codeBox.clientHeight * 0.38;
  scrollY += (target - scrollY) * 0.12;
  pre.style.transform = `translateY(${-scrollY.toFixed(1)}px)`;
}

// ── цикл анимации: замедленная съёмка, тап — перегазовка ──

const hudT = document.getElementById('hudT'), hudL = document.getElementById('hudL');
const fpsEl = document.getElementById('fps'), pauseBtn = document.getElementById('pause');
let paused = false, clock = 0, lastNow = performance.now(), fps = 60, theta = 0, rev = 0;

function reset() { clock = 0; scrollY = 0; theta = 0; rev = 0; }

function frame(now) {
  const dt = Math.max(0, Math.min(0.1, (now - lastNow) / 1000)); lastNow = now;
  fps += ((dt > 0 ? 1 / dt : 60) - fps) * 0.05;
  if (!paused) {
    clock += dt; rev *= Math.pow(0.3, dt);
    const speed = smoothStart(clock) * (0.55 + 1.6 * rev);         // оборотов в секунду на экране
    theta -= speed * TAU * dt;
  }
  setCamera(clock);
  render(clock, theta);
  code(clock % CODE_LOOP);
  hudT.innerHTML = `<b></b>t ${clock.toFixed(2)}s`;
  const rpm = Math.round((900 + 6200 * rev) / 10) * 10;
  const deg = ((-theta * 180 / Math.PI) % 720 + 720) % 720;
  const ord = ORDER.map(n => n === stats.firing ? `[${n}]` : ` ${n} `).join('');
  hudL.textContent = `ascii v8 · 2026   rpm ${rpm} · slow-mo\ncrank ${deg.toFixed(0).padStart(3, '0')}°  order${ord}\nletters ${stats.letters.toLocaleString('en')}`;
  fpsEl.textContent = paused ? 'paused' : `running · ${Math.round(fps)} fps`;
  requestAnimationFrame(frame);
}
function smoothStart(t) { const x = Math.min(1, Math.max(0, (t - 2.4) / 1.5)); return x * x * (3 - 2 * x); }

document.getElementById('stage').addEventListener('click', e => {
  if (e.target.id === 'replay') { reset(); paused = false; pauseBtn.textContent = '⏸'; return; }
  if (e.target.id === 'pause') { paused = !paused; pauseBtn.textContent = paused ? '▶' : '⏸'; return; }
  if (paused) return;
  rev = 1;
  try { window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy'); } catch (e) {}
});
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

// Telegram Mini App: на весь экран, чёрная шапка
try {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }
} catch (e) {}
</script>
