<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII-кольцо</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;color:#bbb}
  #app{position:relative;height:100%;width:min(100vw,62vh);margin:0 auto;display:flex;flex-direction:column;background:#000}
  #stage{position:relative;flex:0 0 61%;overflow:hidden;cursor:pointer}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:absolute;font-size:11px;line-height:1.55;color:#8a8a8a;pointer-events:none;white-space:pre}
  #hudL{left:6%;bottom:2.5%}
  #hudT{right:4%;top:11%;color:#ff6b81}
  #hudT b{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff4d6d;margin-right:6px;vertical-align:1px}
  #replay{position:absolute;left:4%;top:3%;background:none;border:1px solid #333;color:#888;font:inherit;font-size:11px;
    padding:3px 8px;border-radius:4px;cursor:pointer}
  #replay:hover{color:#ddd;border-color:#666}
  #bar{display:flex;justify-content:space-between;font-size:12px;color:#ddd;padding:6px 3.5% 6px 3.5%;border-bottom:1px solid #1c1c1c}
  #bar span:last-child{color:#888}
  #code{position:relative;flex:1;overflow:hidden;font-size:clamp(10px,3.3vw,15px);line-height:1.6;
    -webkit-mask-image:linear-gradient(#0000 0,#000 14%,#000 72%,#0000 100%);mask-image:linear-gradient(#0000 0,#000 14%,#000 72%,#0000 100%)}
  #pre{position:absolute;left:0;right:0;top:0;margin:0;will-change:transform}
  .ln{display:flex;white-space:pre;border-left:3px solid transparent}
  .ln i{font-style:normal;color:#3d3d3d;width:3.2em;text-align:right;padding-right:1.4em;flex:none}
  .ln.cur{background:#1a0d12;border-left-color:#ff6b81}
  .ln.cur i{color:#777}
  .k{color:#ff7a90}.f{color:#82aaff}.n{color:#f6c177}.s{color:#c3e88d}.c{color:#5f5f5f}
  .cursor{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:#ff6b81;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="replay">↻ заново</button>
    <div class="hud" id="hudT"><b></b>t 0.00s</div>
    <div class="hud" id="hudL"></div>
  </div>
  <div id="bar"><span>$ node art.js</span><span id="fps">running · 60 fps</span></div>
  <div id="code"><div id="pre"></div></div>
</div>

<script id="src">
// ── art.js — 3D-кольцо с бриллиантом, нарисованное буквами ──

const TAU = Math.PI * 2;
const R = 1.0, A = 0.14, B = 0.2;           // радиус кольца, толщина, ширина шинки
const BAND = 0, PRONG = 1, GEM = 2;
const CULET_Y = R + 0.16, GIRDLE_Y = R + 0.50, TABLE_Y = R + 0.68;
const GIRDLE_R = 0.34, TABLE_R = 0.20, FACETS = 8;
const FLOOR_Y = -(R + A) - 0.12;            // «зеркальный» пол для отражения

function rng(seed) {                         // детерминированный генератор
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = rng(1);
const pts = [];

function add(x, y, z, nx, ny, nz, kind, facet = 0) {
  const l = Math.hypot(nx, ny, nz) || 1;
  pts.push({ x, y, z, nx: nx / l, ny: ny / l, nz: nz / l, kind, facet });
}

// ── геометрия: шинка, крапаны, бриллиант ──

function band() {
  for (let i = 0; i < 420; i++) {
    const u = i / 420 * TAU;
    for (let j = 0; j < 24; j++) {
      const v = j / 24 * TAU, r = R + A * Math.cos(v);
      const nr = Math.cos(v) / A, nz = Math.sin(v) / B;
      add(r * Math.cos(u), r * Math.sin(u), B * Math.sin(v),
          nr * Math.cos(u), nr * Math.sin(u), nz, BAND);
    }
  }
}

function prongs() {
  for (let k = 0; k < 4; k++) {
    const ang = TAU / 8 + k * TAU / 4;
    for (let i = 0; i < 56; i++) {
      const t = i / 55, y = R + 0.02 + t * (GIRDLE_Y + 0.07 - R);
      let rad = 0.08 + t * (GIRDLE_R - 0.06);
      if (y > GIRDLE_Y) rad -= (y - GIRDLE_Y) * 1.4;   // коготок над рундистом
      const cx = rad * Math.cos(ang), cz = rad * Math.sin(ang);
      for (let j = 0; j < 8; j++) {
        const w = j / 8 * TAU;
        add(cx + 0.03 * Math.cos(w), y, cz + 0.03 * Math.sin(w),
            Math.cos(w), 0, Math.sin(w), PRONG);
      }
    }
  }
}

function diamond() {
  const step = TAU / FACETS, apo = Math.cos(step / 2);
  const ph = GIRDLE_Y - CULET_Y, ch = TABLE_Y - GIRDLE_Y;
  for (let i = 0; i < 2000; i++) {            // павильон: конус из плоских граней
    const phi = rand() * TAU, t = Math.sqrt(rand());
    const id = Math.round(phi / step), pc = id * step;
    const rr = GIRDLE_R * t * apo / Math.cos(phi - pc);
    add(rr * Math.cos(phi), CULET_Y + t * ph, rr * Math.sin(phi),
        Math.cos(pc) * ph, -GIRDLE_R * apo, Math.sin(pc) * ph, GEM, id % FACETS);
  }
  for (let i = 0; i < 1600; i++) {            // корона
    const phi = rand() * TAU, t = rand();
    const id = Math.floor(phi / step), pc = (id + 0.5) * step;
    const rr = (GIRDLE_R + (TABLE_R - GIRDLE_R) * t) * apo / Math.cos(phi - pc);
    add(rr * Math.cos(phi), GIRDLE_Y + 0.02 + t * (ch - 0.02), rr * Math.sin(phi),
        Math.cos(pc) * ch, (GIRDLE_R - TABLE_R) * apo, Math.sin(pc) * ch, GEM, 8 + id);
  }
  for (let i = 0; i < 700; i++) {             // площадка
    const phi = rand() * TAU, rr = TABLE_R * apo * Math.sqrt(rand());
    add(rr * Math.cos(phi), TABLE_Y, rr * Math.sin(phi), 0, 1, 0, GEM, 16);
  }
  for (let i = 0; i < 360; i++) {             // рундист
    const phi = i / 360 * TAU;
    add(GIRDLE_R * Math.cos(phi), GIRDLE_Y + 0.01, GIRDLE_R * Math.sin(phi),
        Math.cos(phi), 0, Math.sin(phi), GEM, 17);
  }
}

band(); prongs(); diamond();

// ── порядок появления: шинка снизу вверх, затем крапаны, затем камень ──

function drawOrder(p) {
  if (p.kind === BAND) {
    let d = Math.atan2(p.y, p.x) + Math.PI / 2;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    return Math.abs(d) / Math.PI;                         // 0 … 1
  }
  if (p.kind === PRONG) return 1.0 + (p.y - R) / (GIRDLE_Y + 0.07 - R) * 0.25;
  return 1.25 + (p.y - CULET_Y) / (TABLE_Y - CULET_Y) * 0.45;   // … 1.7
}
for (const p of pts) {
  p.order = drawOrder(p);
  p.h = rand();                                           // «зерно» буквы
  p.dx = (rand() - .5) * 0.9; p.dy = (rand() - .3) * 0.8; p.dz = (rand() - .5) * 0.9;
}
const ORDER_MAX = 1.72, DRAW = [0.3, 5.6];                // развёртка за ~5 секунд

const smooth = x => (x = Math.min(1, Math.max(0, x)), x * x * (3 - 2 * x));

// ── свет: ключевой, бегущий контровой и «игра» граней ──

function lights(t) {
  const key = norm([0.0, 0.8, 0.6]);
  const rim = norm([Math.cos(t * 0.9), 0.5, Math.sin(t * 0.9)]);
  return { key, rim, half: norm([key[0], key[1], key[2] + 1]) };
}
function norm(v) { const l = Math.hypot(...v); return v.map(c => c / l); }

function spin(t) {                         // 30°/с после того, как кольцо нарисовано
  const s = t - 6.2;
  if (s <= 0) return 0;
  return (s < 1 ? 15 * s * s : 30 * s - 15) * Math.PI / 180;
}

// ── буквы по яркости ──

const RAMP = [' ', '.', '.,:', ':;-', '-=~+', '+<>()=', 'tjf[]{}?', 'aeozsu?', '0O%&e', '@$#&', '@$#'];
const glyph = (b, h) => { const s = RAMP[Math.min(10, Math.floor(b * 9))]; return s[(h * s.length) | 0]; };
function edgeGlyph(nx, ny) {               // силуэт рисуем штрихами / \ | _
  if (Math.abs(nx) > 2.2 * Math.abs(ny)) return '|';
  if (Math.abs(ny) > 2.2 * Math.abs(nx)) return ny < 0 ? '_' : '-';
  return nx * ny > 0 ? '\\' : '/';
}

// ── рендер в сетку символов ──

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const glow1 = document.createElement('canvas'), glow2 = document.createElement('canvas');
let W, H, DPR, cw, chh, cols, rows, s, cx, cy, stars = [];
let zb, bb, cb, kb, rz, rb, rc;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  glow1.width = cv.width >> 2; glow1.height = cv.height >> 2;
  glow2.width = cv.width >> 3; glow2.height = cv.height >> 3;
  cols = 88; cw = W / cols; chh = cw * 1.55; rows = Math.ceil(H / chh);
  s = Math.min(H * 0.6 / 2.8, W * 0.36 / (R + B));
  cx = W / 2; cy = H * 0.52 + 0.29 * s;
  const n = cols * rows;
  zb = new Float32Array(n); bb = new Float32Array(n); cb = new Array(n); kb = new Int8Array(n);
  rz = new Float32Array(n); rb = new Float32Array(n); rc = new Array(n);
  const r = rng(7); stars = [];
  for (let i = 0; i < 230; i++)
    stars.push({ c: (r() * cols) | 0, r: (r() * rows) | 0, a: 0.05 + r() * 0.3,
                 p: r() * TAU, ch: '..........·+*$%'[(r() * 15) | 0] });
}

function project(x, y, z, ca, sa) {
  const xr = x * ca + z * sa, zr = -x * sa + z * ca;
  const tl = 0.12, yr = y * Math.cos(tl) - zr * Math.sin(tl), zt = y * Math.sin(tl) + zr * Math.cos(tl);
  const f = 4 / (4 - zt);
  return [cx + xr * s * f, cy - yr * s * f, zt];
}

const stats = { glints: 0, letters: 0 };

function render(t) {
  const n = cols * rows;
  zb.fill(-1e9); rz.fill(-1e9); kb.fill(-1);
  const head = (t - DRAW[0]) / (DRAW[1] - DRAW[0]) * ORDER_MAX;
  const a = spin(t), ca = Math.cos(a), sa = Math.sin(a);
  const L = lights(t), tl = 0.12, ct = Math.cos(tl), st = Math.sin(tl);
  let glints = 0;

  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (p.order > head) continue;
    const k = smooth((head - p.order) / 0.06), d = (1 - k) * (1 - k) * (1 - k);
    const [sx, sy, z] = project(p.x + p.dx * d, p.y + p.dy * d, p.z + p.dz * d, ca, sa);
    const c = (sx / cw) | 0, r = (sy / chh) | 0;
    if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
    const idx = r * cols + c;

    // отражение — только каждая вторая точка, по зеркалу пола
    if (i & 1) {
      const [rx, ry, rzz] = project(p.x, 2 * FLOOR_Y - p.y, p.z, ca, sa);
      const c2 = (rx / cw) | 0, r2 = (ry / chh) | 0;
      if (c2 >= 0 && c2 < cols && r2 >= 0 && r2 < rows) {
        const j = r2 * cols + c2;
        if (rzz > rz[j]) { rz[j] = rzz; rb[j] = k; rc[j] = glyph(0.55 + 0.4 * p.h, p.h); }
      }
    }
    if (z <= zb[idx]) continue;
    zb[idx] = z;

    // нормаль в пространстве камеры
    const nx = p.nx * ca + p.nz * sa, nz0 = -p.nx * sa + p.nz * ca;
    const ny = p.ny * ct - nz0 * st, nz = p.ny * st + nz0 * ct;
    const diff = Math.max(0, nx * L.key[0] + ny * L.key[1] + nz * L.key[2]);
    const sp = Math.max(0, nx * L.half[0] + ny * L.half[1] + nz * L.half[2]);
    const rim = Math.pow(1 - Math.abs(nz), 3) * Math.max(0, nx * L.rim[0] + ny * L.rim[1] + nz * L.rim[2]);
    let b;
    if (p.kind === GEM) {
      const fire = Math.pow(0.5 + 0.5 * Math.sin(t * 5 + p.facet * 2.3 + a * 3), 6);
      b = 0.5 + 0.35 * diff + 0.9 * Math.pow(sp, 40) + 0.6 * fire + 0.3 * rim;
    } else {
      b = (0.34 + 0.45 * diff + 0.8 * Math.pow(sp, 18) + 0.5 * rim) * (0.75 + 0.35 * p.h);
    }
    b *= k;
    const near = Math.abs(head - p.order);
    if (near < 0.035 && k > 0.5) b = Math.max(b, 1.2 - near * 10);  // «перо», которое рисует
    const settled = k > 0.98;
    if (b > 0.95 && settled) glints++;

    bb[idx] = settled ? b : Math.min(b, 0.99); kb[idx] = p.kind;
    cb[idx] = (settled && Math.abs(nz) < 0.28 && p.kind !== GEM) ? edgeGlyph(nx, ny) : glyph(b, p.h);
  }
  stats.glints = glints;
  draw(t, head, a);
}

function draw(t, head, a) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.font = `${Math.min(chh * 0.95, cw / 0.6).toFixed(2)}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  const put = (c, r, ch, b, tint) => {
    ctx.fillStyle = tint
      ? `rgba(${215 + 40 * b | 0},${228 + 27 * b | 0},255,${Math.min(1, b)})`
      : `rgba(255,255,255,${Math.min(1, b)})`;
    ctx.fillText(ch, c * cw + cw / 2, r * chh);
  };

  // звёзды и пыль на фоне
  for (const st of stars) {
    const b = st.a * (0.55 + 0.45 * Math.sin(t * 1.7 + st.p));
    put(st.c, st.r, st.ch, b);
  }

  // гем в экранных координатах — от него расходятся лучи
  const [gx, gy] = project(0, GIRDLE_Y + 0.08, 0, Math.cos(a), Math.sin(a));
  const gc = gx / cw, gr = gy / chh, gemOn = smooth((head - 1.35) / 0.3);
  if (gemOn > 0) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.3);
    for (const [dx, dy] of [[1, .62], [-1, .62], [1, -.42], [-1, -.42]]) {
      for (let q = 4; q < 60; q += 2.4) {
        const c = Math.round(gc + dx * q), r = Math.round(gr + dy * q * cw / chh * 1.6);
        if (c < 0 || c >= cols || r < 0 || r >= rows) break;
        put(c, r, q % 7 < 1.3 ? '+' : '.', 0.16 * gemOn * pulse * (1 - q / 70));
      }
    }
  }

  // отражение
  let letters = 0;
  const floorRow = project(0, FLOOR_Y, 0, 1, 0)[1] / chh;
  for (let i = 0; i < cols * rows; i++) {
    if (rz[i] < -1e8 || zb[i] > -1e8) continue;
    const r = (i / cols) | 0;
    if (r < floorRow) continue;
    const fade = Math.max(0, 1 - (r - floorRow) / 22);
    put(i % cols, r, rc[i], 0.09 * rb[i] * fade);
  }

  // само кольцо
  const hot = [];
  for (let i = 0; i < cols * rows; i++) {
    if (zb[i] < -1e8) continue;
    const ch = cb[i];
    if (ch === ' ') continue;
    letters++;
    put(i % cols, (i / cols) | 0, ch, 0.18 + bb[i] * 0.82, kb[i] === GEM);
    if (bb[i] > 1.0) hot.push(i);
  }
  stats.letters = letters;

  // блики-звёздочки: лучи | - / \ из самых ярких точек
  let shown = 0;
  for (const i of hot) {
    const life = Math.sin(t * 2.2 + (i * 12.9898 % TAU));
    if (life < 0.75 || shown > 5) continue;
    shown++;
    const c = i % cols, r = (i / cols) | 0, len = 2 + Math.round((life - 0.75) * 28);
    put(c, r, '*', 1, true);
    for (let q = 1; q <= len; q++) {
      const b = (1 - q / (len + 1)) * 0.9;
      put(c, r - q, '|', b, true); put(c, r + q, '|', b, true);
      put(c - q * 1.6 | 0, r, '-', b, true); put(c + q * 1.6 | 0, r, '-', b, true);
      if (q <= len / 2) {
        put(c - q, r - q, '\\', b * .7, true); put(c + q, r + q, '\\', b * .7, true);
        put(c + q, r - q, '/', b * .7, true); put(c - q, r + q, '/', b * .7, true);
      }
    }
  }
  // вертикальный луч над камнем
  if (gemOn > 0) {
    const tc = Math.round(gc), tr = Math.round(project(0, TABLE_Y, 0, 1, 0)[1] / chh);
    for (let q = 1; q < 9; q++) put(tc, tr - q, '|', 0.5 * gemOn * (1 - q / 9) * (0.6 + 0.4 * Math.sin(t * 3)), true);
  }

  // мягкое свечение: уменьшаем копию и накладываем её поверх
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g1 = glow1.getContext('2d'), g2 = glow2.getContext('2d');
  g1.clearRect(0, 0, glow1.width, glow1.height); g1.drawImage(cv, 0, 0, glow1.width, glow1.height);
  g2.clearRect(0, 0, glow2.width, glow2.height); g2.drawImage(glow1, 0, 0, glow2.width, glow2.height);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.55; ctx.drawImage(glow1, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 0.5;  ctx.drawImage(glow2, 0, 0, cv.width, cv.height);
}

// ── панель кода: показывает этот самый файл и «печатает» текущую строку ──

const SRC = document.getElementById('src').textContent.replace(/^\n+|\s+$/g, '').split('\n');
const KW = /\b(const|let|var|function|return|for|if|else|of|new|while|continue|break|true|false|null)\b/;
function hl(line) {
  const esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const re = /(\/\/.*$)|('(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    const tok = esc(m[0]);
    if (m[1]) out += `<span class="c">${tok}</span>`;
    else if (m[2]) out += `<span class="s">${tok}</span>`;
    else if (m[3]) out += `<span class="n">${tok}</span>`;
    else if (KW.test(m[4]) && KW.exec(m[4])[0] === m[4]) out += `<span class="k">${tok}</span>`;
    else if (line[re.lastIndex] === '(') out += `<span class="f">${tok}</span>`;
    else out += tok;
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}
const pre = document.getElementById('pre'), codeBox = document.getElementById('code');
const rowsEl = SRC.map((l, i) => {
  const d = document.createElement('div'); d.className = 'ln';
  d.innerHTML = `<i>${i + 1}</i><span>${hl(l) || ' '}</span>`;
  pre.appendChild(d); return d;
});
const LINES_PER_S = 7, LOOP = Math.max(40, SRC.length / LINES_PER_S + 6);
let curLine = -1, curChars = -1, scrollY = 0;

function code(t) {
  const pos = Math.min(SRC.length - 1e-3, t * LINES_PER_S);
  const li = Math.floor(pos), text = SRC[li];
  const nch = Math.floor((pos - li) * 1.4 * text.length);
  if (li !== curLine) {
    if (curLine >= 0 && rowsEl[curLine]) {
      rowsEl[curLine].classList.remove('cur');
      rowsEl[curLine].lastChild.innerHTML = hl(SRC[curLine]) || ' ';
    }
    curLine = li; curChars = -1; rowsEl[li].classList.add('cur');
  }
  if (nch !== curChars) {
    curChars = nch;
    rowsEl[li].lastChild.innerHTML = hl(text.slice(0, nch)) + '<span class="cursor"></span>';
  }
  const target = rowsEl[li].offsetTop - codeBox.clientHeight * 0.38;
  scrollY += (target - scrollY) * 0.12;
  pre.style.transform = `translateY(${-scrollY.toFixed(1)}px)`;
}

// ── цикл анимации ──

const hudT = document.getElementById('hudT'), hudL = document.getElementById('hudL');
const fpsEl = document.getElementById('fps');
let paused = false, clock = 0, lastNow = performance.now(), fps = 60;

function frame(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (!paused) clock += dt;
  fps += ((dt > 0 ? 1 / dt : 60) - fps) * 0.05;
  const t = clock % LOOP;
  render(t); code(t);
  const deg = (spin(t) * 180 / Math.PI) % 360;
  hudT.innerHTML = `<b></b>t ${t.toFixed(2)}s`;
  hudL.textContent = `ascii ring · 2026\nrotation ${deg.toFixed(2).padStart(6, '0')}°   glints ${stats.glints}\nletters ${stats.letters.toLocaleString('en')}`;
  fpsEl.textContent = paused ? 'paused · нажмите на кольцо' : `running · ${Math.round(fps)} fps`;
  requestAnimationFrame(frame);
}

document.getElementById('stage').addEventListener('click', e => {
  if (e.target.id === 'replay') { clock = 0; scrollY = 0; paused = false; return; }
  paused = !paused;
});
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>

    tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();

} catch (e) {}
